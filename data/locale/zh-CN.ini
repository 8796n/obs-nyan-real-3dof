spatial.distance_gain_tooltip="根据侧边面板中的屏幕距离动态增减音量（基准距离 4 米，越近声音越大；限制在 -12 到 +6 dB 范围）。"
audiowall.name="空间音频墙 (Audio Wall)"
audiowall.enable="启用空间音频"
audiowall.notice="自动检测正在发声的应用，根据其窗口在桌面上的实际物理位置计算声场方位，并合成跟随头部旋转的整体空间音频。无需针对每个应用手动配置音频采集与滤镜，直接开启本组即可。声音经由 OBS 监听路径输出（应用原生声音不经过 OBS，请将 Windows 默认输出设备设为您听不到的设备）。注意：音频按进程为单位，若同一应用横跨多块屏幕，声场将归并为一个方向。"
