spatial.name="nyan 空间音频 (3DoF)"
spatial.notice="将声音固定在虚拟空间的指定方位角（回正后 0 度为正前方），并随头部转动进行声场平移。将其添加到应用程序音频采集滤镜中，并调整方位使其对齐对应屏幕。添加该滤镜会自动将父来源设为仅监听，侧边面板的“音频输出目标”用于指定监听流向（默认输出至眼镜）。应用程序自身声音仍由系统播放，请将 Windows 默认输出设备设为您听不到的静音通道。"
