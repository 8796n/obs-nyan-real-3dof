<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-2.0-or-later
     Copyright (C) 2026 8796n <info@8796.jp>
     nyan Real 3DoF phone remote: a single-file touchpad page served by the
     plugin's LAN WebSocket server (src/remote_control.cpp). The access token
     arrives in the page URL (?t=...) and is echoed back on the WS upgrade. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="nyan Remote">
<meta name="theme-color" content="#141417">
<title>nyan Real 3DoF Remote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    display: flex; flex-direction: column; gap: 8px;
    height: 100dvh; padding: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: #141417; color: #d6d6dc;
    font-family: system-ui, sans-serif;
    touch-action: none;
  }
  .row { display: flex; gap: 8px; }
  button {
    border: 1px solid #34343c; border-radius: 12px;
    background: #222228; color: #d6d6dc;
    font-size: 15px; padding: 12px 8px;
    touch-action: none;
  }
  button:active { background: #3c3c48; }
  #top button { flex: 1; }
  /* 3DoF (head-pose follow) toggle: small, lit blue while following. */
  #btn-pose.active { background: #2c4a6b; border-color: #4c7bb0; color: #eaf2ff; }
  /* Keyboard button pulses blue while the host has a typable field focused
     (server's edit flag, from the UIA focus watch), inviting a tap. It never
     auto-opens the panel - mobile browsers need a tap to show the keyboard. */
  @keyframes kbdpulse { 0%, 100% { background: #222228; border-color: #34343c; } 50% { background: #2c4a6b; border-color: #4c7bb0; } }
  #btn-kbd.hint { animation: kbdpulse 1.1s ease-in-out infinite; }
  /* Wall focus picker: a horizontal, wrapping strip of number buttons. Hidden
     (display:none) until the wall has 2+ focusable displays. */
  #focus-row { display: none; flex-wrap: wrap; gap: 6px; }
  #focus-row button { flex: 1 1 auto; min-width: 42px; padding: 9px 6px; font-size: 14px; }
  #focus-row button.active { background: #2c4a6b; border-color: #4c7bb0; color: #eaf2ff; }
  #focus-row .flabel { flex: 0 0 100%; font-size: 11px; color: #7e8aa0; padding: 0 2px 1px; }
  #status { display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 12px; color: #8a8a94; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #c0463f; flex: none; }
  #dot.on { background: #4caf50; }
  #mid { flex: 1; display: flex; gap: 8px; min-height: 0; }
  #pad {
    flex: 1; border: 1px solid #2c2c34; border-radius: 14px; background: #1a1a1f;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    color: #4c4c56; font-size: 13px; text-align: center; line-height: 1.7;
    touch-action: none;
  }
  #pad.drag { border-color: #4caf50; }
  #strip {
    width: 64px; border: 1px solid #2c3340; border-radius: 14px; background: #1b2027;
    display: flex; flex-direction: column; align-items: stretch;
    color: #7e8aa0; font-size: 12px;
  }
  /* The dolly gesture lives on this inner area only, so the side toggle below
     keeps a clean hit target. */
  #strip-dolly {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: space-between; padding: 12px 0; touch-action: none;
  }
  #strip .arrow { font-size: 16px; color: #55607a; }
  /* Left-handed: move the distance strip to the left of the pad (flex order). */
  #mid.strip-left #strip { order: -1; }
  #strip-side { flex: none; background: none; border: none;
    border-top: 1px solid #2c3340; color: #6b768c; font-size: 18px;
    padding: 12px 0; cursor: pointer; line-height: 1; }
  #strip-side:active { background: #232a33; }
  #dist-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #dist { font-size: 14px; color: #aab6cc; font-variant-numeric: tabular-nums; }
  #overlay {
    position: absolute; inset: 0; background: #141417;
    display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: #c0463f; font-size: 15px; line-height: 1.8;
  }
  #cfg {
    position: absolute; inset: 0; background: #141417; z-index: 10;
    display: none; flex-direction: column; color-scheme: dark;
    padding: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  #cfg.on { display: flex; }
  #cfg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #cfg-head span { flex: 1; font-size: 16px; color: #d6d6dc; padding-left: 4px; }
  #cfg-body {
    flex: 1; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .cfg-sec { margin: 14px 4px 4px; font-size: 13px; color: #7e8aa0; border-bottom: 1px solid #2c3340; padding-bottom: 4px; }
  .cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 4px; border-bottom: 1px solid #1f1f24; font-size: 14px; }
  .cfg-row.col { flex-direction: column; align-items: stretch; gap: 4px; }
  .cfg-row .lab { color: #b9b9c2; }
  .cfg-row .val { color: #8a8a94; text-align: right; }
  .cfg-row.off { opacity: 0.45; pointer-events: none; }
  .cfg-row input[type="range"] { width: 100%; margin: 2px 0; }
  .cfg-row input[type="checkbox"] { width: 22px; height: 22px; flex: none; }
  .cfg-row select, .cfg-row input[type="text"], .cfg-row input[type="number"] {
    background: #222228; color: #d6d6dc; border: 1px solid #34343c;
    border-radius: 8px; padding: 7px 8px; font-size: 14px; max-width: 60%;
  }
  .cfg-row input[type="text"], .cfg-row input[type="number"] {
    -webkit-user-select: text; user-select: text;
  }
  .cfg-row button { padding: 9px 14px; font-size: 14px; }
  /* Keyboard panel: a full-screen overlay like #cfg. The textarea uses the
     phone's native IME (so Japanese composes here), and "send" transmits the
     confirmed string; the host injects it as literal Unicode. */
  #kbd {
    position: absolute; inset: 0; background: #141417; z-index: 10;
    display: none; flex-direction: column; color-scheme: dark;
    padding: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
  }
  #kbd.on { display: flex; }
  #kbd-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #kbd-head span { flex: 1; font-size: 16px; color: #d6d6dc; padding-left: 4px; }
  #kbd-text {
    width: 100%; min-height: 84px; resize: none;
    background: #1a1a1f; color: #d6d6dc; border: 1px solid #34343c;
    border-radius: 10px; padding: 10px; font-size: 16px; line-height: 1.5;
    -webkit-user-select: text; user-select: text; touch-action: auto;
  }
  #kbd-send-row { margin-top: 8px; }
  #kbd-send-row button { padding: 14px 8px; font-size: 15px; }
  #btn-send-enter { color: #aab6cc; }
  #kbd-keys { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  #kbd-keys button { flex: 1 1 auto; min-width: 52px; padding: 12px 6px; font-size: 16px; }
</style>
</head>
<body>
  <div id="top" class="row">
    <button id="btn-pose" style="flex:0 0 64px">3DoF</button>
    <button id="btn-recenter">センター</button>
    <button id="btn-kbd" style="flex:0 0 52px" aria-label="keyboard">⌨</button>
    <button id="btn-cfg" style="flex:0 0 52px" aria-label="settings">⚙</button>
    <button id="btn-fs" style="flex:0 0 52px" aria-label="fullscreen">⛶</button>
  </div>
  <!-- Wall focus picker: number buttons for the Display Wall's monitors,
       populated from the cfg push (wall/focus). Hidden when the wall has at
       most one focusable display. -->
  <div id="focus-row"></div>
  <div id="mid">
    <div id="pad"><span id="pad-title" style="font-size:15px;color:#5a5a66">タッチパッド</span><span id="pad-hint"></span></div>
    <div id="strip">
      <div id="strip-dolly">
        <span class="arrow">▲</span>
        <div id="dist-box"><span id="dist-label">距離</span><span id="dist">-</span></div>
        <span class="arrow">▼</span>
      </div>
      <button id="strip-side" aria-label="move strip">◀</button>
    </div>
  </div>
  <!-- Bump the rev when changing this file: the dim corner marker lets a
       phone verify it got the new page without devtools. Tapping it fires a
       long test vibration - a bare navigator.vibrate() check, independent of
       any gesture logic. -->
  <div id="status"><span id="dot"></span><span id="status-text">…</span><span id="rev" style="margin-left:auto;color:#3c3c44;font-size:10px;">r21</span></div>
  <div id="cfg">
    <div id="cfg-head"><span id="cfg-title"></span><button id="btn-cfg-close" style="flex:0 0 80px"></button></div>
    <div id="cfg-body"></div>
  </div>
  <!-- Keyboard panel. Open it AFTER clicking the target field on the host via
       the touchpad: SendInput types into whatever the host has focused, which
       this overlay does not change. -->
  <div id="kbd">
    <div id="kbd-head"><span id="kbd-title"></span><button id="btn-kbd-close" style="flex:0 0 80px"></button></div>
    <textarea id="kbd-text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div id="kbd-send-row" class="row">
      <button id="btn-send" style="flex:1"></button>
      <button id="btn-send-enter" style="flex:0 0 42%"></button>
    </div>
    <div id="kbd-keys"></div>
  </div>
  <div id="overlay"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const DICTS = {
  ja: {
    recenter: 'センター', recal: '再較正', pose: '姿勢追従 (3DoF)',
    focusTitle: '注目ディスプレイ', focusAll: '全体',
    pad: 'タッチパッド',
    hint: '1本指: 移動 ・ タップ: 左クリック<br>長押し: ドラッグ (指を離しても一瞬なら継続)<br>2本指: スクロール ・ 2本指タップ: 右クリック',
    distLabel: '距離', conn: '接続中', disc: '再接続中…',
    cfgTitle: '設定', close: '閉じる',
    kbdTitle: '文字入力', kbdPlaceholder: 'ここに入力して送信',
    send: '送信', sendEnter: '送信+改行',
    localSec: 'リモコン操作 (この端末に保存)',
    sens: 'カーソル速度', wheelSpd: 'スクロール速度', dollySpd: '距離ホイール速度',
    holdMs: '長押し時間 (ms)', vibStr: '振動の強さ (0=オフ)',
    localReset: '操作設定を既定値に戻す',
    noToken: 'アクセストークンがありません。<br>OBS の nyan Real 3DoF ドックに表示される QR コードからこのページを開いてください。',
  },
  en: {
    recenter: 'Center', recal: 'Recalibrate', pose: 'Head tracking (3DoF)',
    focusTitle: 'Focus display', focusAll: 'All',
    pad: 'Touchpad',
    hint: '1 finger: move / tap: left click<br>hold: drag (brief lifts keep it going)<br>2 fingers: scroll / 2-finger tap: right click',
    distLabel: 'Distance', conn: 'Connected', disc: 'Reconnecting…',
    cfgTitle: 'Settings', close: 'Close',
    kbdTitle: 'Text input', kbdPlaceholder: 'Type here, then send',
    send: 'Send', sendEnter: 'Send + Enter',
    localSec: 'Remote input (saved on this device)',
    sens: 'Cursor speed', wheelSpd: 'Scroll speed', dollySpd: 'Distance wheel speed',
    holdMs: 'Hold time (ms)', vibStr: 'Vibration strength (0 = off)',
    localReset: 'Reset input settings',
    noToken: 'Missing access token.<br>Open this page from the QR code shown in the nyan Real 3DoF dock in OBS.',
  },
};
/* Before the first connection the browser language decides; once connected
   the server's state message carries OBS's language and the page follows it,
   so the touchpad chrome matches the server-localized settings mirror. */
let L = DICTS[(navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en'];
function applyLabels() {
  $('btn-recenter').textContent = L.recenter;
  $('btn-pose').title = L.pose;
  $('pad-title').textContent = L.pad;
  $('pad-hint').innerHTML = L.hint;
  $('dist-label').textContent = L.distLabel;
  $('cfg-title').textContent = L.cfgTitle;
  $('btn-cfg-close').textContent = L.close;
  $('kbd-title').textContent = L.kbdTitle;
  $('btn-kbd-close').textContent = L.close;
  $('kbd-text').placeholder = L.kbdPlaceholder;
  $('btn-send').textContent = L.send;
  $('btn-send-enter').textContent = L.sendEnter;
}
function applyLang(code) {
  if (!DICTS[code] || DICTS[code] === L) return;
  L = DICTS[code];
  applyLabels();
  setStatus(wsOpen);
  cfgSig = ''; // rebuild the settings panel (local row labels) next render
  renderCfg();
  renderFocus();
  renderPose();
}
applyLabels();

const token = new URLSearchParams(location.search).get('t') || '';
if (!token) {
  const o = $('overlay');
  o.innerHTML = L.noToken;
  o.style.display = 'flex';
}

/* All haptic pulses scale with TUNE.vib (0 disables them); the rev marker's
   self-test stays raw on purpose - it diagnoses the API itself. */
const vibrate = ms => {
  const t = Math.round(ms * TUNE.vib);
  if (t > 0 && navigator.vibrate) navigator.vibrate(t);
};

/* Distance detent: one haptic tick per real 0.5 m boundary the screen crosses
   (driven by the server's reported distance, not finger travel), rate-limited
   so a fast slide does not stall the motor with back-to-back vibrate() calls. */
const DETENT_M = 0.5;
let lastDistBucket = null, lastDetentMs = 0;

/* Input coefficients, persisted per device (localStorage): screen DPI and
   finger feel differ between phones, so these are page-local settings and
   intentionally NOT part of the dock mirror (no server round-trip). */
const TUNE_DEF = { sens: 1.7, wheel: 1.0, dolly: 1.0, hold: 350, vib: 1.0 };
const TUNE = { ...TUNE_DEF };
try {
  const saved = JSON.parse(localStorage.getItem('nyanRemoteTune') || '{}');
  for (const k in TUNE_DEF) if (typeof saved[k] === 'number') TUNE[k] = saved[k];
} catch (e) {}
function saveTune() {
  try { localStorage.setItem('nyanRemoteTune', JSON.stringify(TUNE)); } catch (e) {}
}

/* Distance strip side (left-handed support): a page-local layout preference,
   persisted in localStorage and intentionally NOT mirrored to the dock. */
let stripLeft = false;
try { stripLeft = localStorage.getItem('nyanRemoteStripLeft') === '1'; } catch (e) {}
function applyStripSide() {
  $('mid').classList.toggle('strip-left', stripLeft);
  // The arrow points where a tap sends the strip (right side -> ◀ = go left).
  $('strip-side').textContent = stripLeft ? '▶' : '◀';
}
$('strip-side').addEventListener('click', () => {
  stripLeft = !stripLeft;
  try { localStorage.setItem('nyanRemoteStripLeft', stripLeft ? '1' : '0'); } catch (e) {}
  applyStripSide();
});
applyStripSide();

let ws = null, wsOpen = false, reconnectTimer = 0;
function setStatus(on) {
  $('dot').className = on ? 'on' : '';
  $('status-text').textContent = on ? L.conn : L.disc;
}
function connect() {
  if (!token) return;
  if (ws && ws.readyState <= 1) return; // CONNECTING or OPEN already
  clearTimeout(reconnectTimer);
  ws = new WebSocket('ws://' + location.host + '/ws?t=' + encodeURIComponent(token));
  ws.onopen = () => { wsOpen = true; setStatus(true); };
  ws.onclose = () => {
    wsOpen = false; setStatus(false);
    applyEdit(false); // no live focus info while disconnected
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 1200);
  };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
  ws.onmessage = ev => {
    try {
      const m = JSON.parse(ev.data);
      if (m.t === 'state' && typeof m.dist === 'number') {
        $('dist').textContent = m.dist.toFixed(2) + ' m';
        const bucket = Math.floor(m.dist / DETENT_M);
        if (lastDistBucket !== null && bucket !== lastDistBucket) {
          const now = performance.now();
          if (now - lastDetentMs >= 50) { lastDetentMs = now; vibrate(10); }
        }
        lastDistBucket = bucket;
        if (m.lang) applyLang(m.lang);
        if (typeof m.edit === 'boolean') applyEdit(m.edit);
      } else if (m.t === 'cfg' && Array.isArray(m.sections)) {
        cfgData = m;
        // Honour the server's focus/pose unless a local tap is still settling.
        if (typeof m.focus === 'number' && performance.now() - focusTouched > 800)
          focusCur = m.focus;
        if (typeof m.pose === 'boolean' && performance.now() - poseTouched > 800)
          poseCur = m.pose;
        renderCfg();
        renderFocus();
        renderPose();
      }
    } catch (e) {}
  };
}
function send(obj) {
  if (wsOpen && ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
}
setStatus(false);
connect();
/* Liveness heartbeat: lets the plugin evict this session ~12 s after the
   screen locks or Wi-Fi drops (its dock then shows the QR code again).
   Background tabs throttle timers, which is exactly the signal we want. */
setInterval(() => send({ t: 'hb' }), 4000);

/* Outbound events are coalesced per animation frame so a fast drag becomes
   one WS message per display refresh instead of one per touch event. */
let pendDx = 0, pendDy = 0, pendWheel = 0, pendDist = 0, rafQueued = false;
function flushSoon() {
  if (rafQueued) return;
  rafQueued = true;
  requestAnimationFrame(() => {
    rafQueued = false;
    if (pendDx || pendDy) {
      send({ t: 'mv', dx: +pendDx.toFixed(1), dy: +pendDy.toFixed(1) });
      pendDx = pendDy = 0;
    }
    if (pendWheel) {
      send({ t: 'whl', n: +pendWheel.toFixed(3) });
      pendWheel = 0;
    }
    if (pendDist) {
      send({ t: 'dist', s: +pendDist.toFixed(2) });
      pendDist = 0;
    }
  });
}

/* Touchpad: 1-finger move, tap = left click, press-and-hold = drag (left
   button held; a brief lift and re-touch continues the drag, so long drags
   can be done in strokes), 2-finger vertical = wheel, 2-finger tap = right
   click. */
const SENS = 1.0;          // touchpad px -> cursor px, base (x TUNE.sens)
const WHEEL_PX = 60;       // 2-finger px per wheel notch (/ TUNE.wheel)
// Stationary press before a drag starts: TUNE.hold (ms, per-device setting).
const HOLD_TRAVEL = 12;    // px of movement that cancels the hold
const DRAG_LOCK_MS = 250;  // lift shorter than this keeps the drag held
const pad = $('pad');
const fingers = new Map();
let maxFingers = 0, gestureT0 = 0, travel = 0;
let holdTimer = 0, dragging = false, dragReleaseTimer = 0;
pad.addEventListener('pointerdown', e => {
  pad.setPointerCapture(e.pointerId);
  fingers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (fingers.size === 1) {
    gestureT0 = performance.now(); travel = 0; maxFingers = 0;
    if (dragging) {
      // Re-touch inside the release window: same drag, next stroke.
      clearTimeout(dragReleaseTimer);
    } else {
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        if (fingers.size === 1 && travel < HOLD_TRAVEL && !dragging) {
          dragging = true;
          send({ t: 'btn', b: 0, d: true });
          pad.classList.add('drag');
          vibrate(30);
        }
      }, TUNE.hold);
    }
  } else {
    // A second finger means a 2-finger gesture, not a hold.
    clearTimeout(holdTimer);
  }
  maxFingers = Math.max(maxFingers, fingers.size);
});
pad.addEventListener('pointermove', e => {
  const f = fingers.get(e.pointerId);
  if (!f) return;
  const dx = e.clientX - f.x, dy = e.clientY - f.y;
  f.x = e.clientX; f.y = e.clientY;
  travel += Math.abs(dx) + Math.abs(dy);
  if (fingers.size === 1 && maxFingers === 1) {
    pendDx += dx * SENS * TUNE.sens;
    pendDy += dy * SENS * TUNE.sens;
  } else if (fingers.size === 2 && !dragging) {
    // Both fingers report moves; halving keeps the sum at finger speed.
    pendWheel += -(dy * 0.5) * TUNE.wheel / WHEEL_PX;
  }
  flushSoon();
});
function padEnd(e) {
  if (!fingers.delete(e.pointerId)) return;
  if (fingers.size) return;
  clearTimeout(holdTimer);
  if (dragging) {
    // Defer the button release: re-touching within the window continues
    // the drag (the border stays green until it really ends).
    clearTimeout(dragReleaseTimer);
    dragReleaseTimer = setTimeout(() => {
      dragging = false;
      send({ t: 'btn', b: 0, d: false });
      pad.classList.remove('drag');
      vibrate(15);
    }, DRAG_LOCK_MS);
  } else {
    const quick = performance.now() - gestureT0 < 300 && travel < 14;
    if (quick && maxFingers === 1) { clickTap(0); }
    else if (quick && maxFingers === 2) { clickTap(1); }
  }
  maxFingers = 0;
}
pad.addEventListener('pointerup', padEnd);
pad.addEventListener('pointercancel', padEnd);
function clickTap(b) {
  send({ t: 'btn', b: b, d: true });
  send({ t: 'btn', b: b, d: false });
  vibrate(15);
}

/* Edge strip: vertical drag walks the viewer toward/away from the gazed-at
   point on the plugin's log scale. Up = back away, down = walk closer.
   A weak haptic tick every couple of steps gives it a wheel-detent feel. */
const DIST_PX = 7;       // px per distance step (~1.05x each)
const strip = $('strip-dolly'); // the dolly gesture area (toggle button is outside)
const stripPts = new Map();
strip.addEventListener('pointerdown', e => {
  strip.setPointerCapture(e.pointerId);
  stripPts.set(e.pointerId, e.clientY);
});
strip.addEventListener('pointermove', e => {
  if (!stripPts.has(e.pointerId)) return;
  const dy = e.clientY - stripPts.get(e.pointerId);
  stripPts.set(e.pointerId, e.clientY);
  // The haptic detent now fires on real 0.5 m boundaries from the server's
  // reported distance (see the state handler), not on finger travel.
  pendDist += -dy / DIST_PX * TUNE.dolly;
  flushSoon();
});
const stripEnd = e => stripPts.delete(e.pointerId);
strip.addEventListener('pointerup', stripEnd);
strip.addEventListener('pointercancel', stripEnd);

$('btn-recenter').addEventListener('click', () => { send({ t: 'recenter' }); vibrate(20); });
/* 3DoF (head-pose follow) toggle on the main page. poseCur mirrors the
   server's pose_follow; poseTouched shields a local tap from a lagging push. */
let poseCur = true, poseTouched = 0;
function renderPose() { $('btn-pose').classList.toggle('active', poseCur); $('btn-pose').title = L.pose; }
$('btn-pose').addEventListener('click', () => {
  poseCur = !poseCur; poseTouched = performance.now();
  send({ t: 'pose', v: poseCur }); vibrate(15); renderPose();
});
renderPose();

/* Settings mirror: a generic renderer over the cfg snapshot the plugin
   pushes (sections/rows with type, localized label, value, options). The
   page knows no individual setting - add/remove rows in src/remote_schema
   only. Rows touched in the last moments are not stomped by pushes. */
let cfgData = null, cfgSig = '';
const touched = new Map(); // row key -> last local interaction (ms)
// row key -> row element. Keys can contain CSS-special chars (monitor ids hold
// backslashes), so we look rows up here instead of querySelector('[data-k=..]').
const rowEls = new Map();
/* Wall focus picker (main page). focusCur mirrors the server's focus_display
   (0 = whole wall); focusTouched shields a local tap from being stomped by a
   cfg push that has not yet caught up. */
let focusCur = 0, focusTouched = 0;
function renderFocus() {
  const row = $('focus-row');
  const wall = (cfgData && Array.isArray(cfgData.wall)) ? cfgData.wall : [];
  // Focus is meaningless with 0-1 displays; hide the row entirely.
  if (wall.length < 2) { row.style.display = 'none'; row.textContent = ''; return; }
  row.style.display = 'flex';
  row.textContent = '';
  const lab = document.createElement('div');
  lab.className = 'flabel';
  lab.textContent = L.focusTitle;
  row.appendChild(lab);
  const mk = (n, text, title) => {
    const b = document.createElement('button');
    b.textContent = text;
    if (title) b.title = title;
    if (n === focusCur) b.classList.add('active');
    b.addEventListener('click', () => {
      focusCur = n; focusTouched = performance.now();
      send({ t: 'focus', n: n }); vibrate(15); renderFocus();
    });
    return b;
  };
  row.appendChild(mk(0, L.focusAll));
  for (const d of wall) row.appendChild(mk(d.n, String(d.n), d.name || ''));
}
const decimals = step => { const s = String(step), d = s.indexOf('.'); return d < 0 ? 0 : s.length - d - 1; };
function sendSet(k, v) {
  touched.set(k, performance.now());
  send({ t: 'set', k: k, v: v });
}
function renderCfg() {
  if (!$('cfg').classList.contains('on')) return;
  const sig = !cfgData ? 'local-only' : JSON.stringify(cfgData.sections.map(s => [s.label,
    s.rows.map(r => [r.k, r.type, (r.options || []).map(o => o.v + '|' + o.label).join('|')])]));
  if (sig !== cfgSig) { cfgSig = sig; buildCfg(); }
  if (cfgData) updateCfg();
}
function buildCfg() {
  const body = $('cfg-body');
  body.textContent = '';
  rowEls.clear();
  for (const sec of (cfgData ? cfgData.sections : [])) {
    const h = document.createElement('div');
    h.className = 'cfg-sec';
    h.textContent = sec.label;
    body.appendChild(h);
    for (const r of sec.rows) body.appendChild(buildRow(r));
  }
  buildLocalRows(body);
}
/* Page-local input coefficients: same look as mirrored rows, but they write
   TUNE/localStorage instead of the WebSocket (dock intentionally not shown). */
const LOCAL_ROWS = [
  { k: 'sens',  min: 0.5, max: 4.0, step: 0.1, label: () => L.sens },
  { k: 'wheel', min: 0.3, max: 3.0, step: 0.1, label: () => L.wheelSpd },
  { k: 'dolly', min: 0.3, max: 3.0, step: 0.1, label: () => L.dollySpd },
  { k: 'hold',  min: 200, max: 800, step: 50,  label: () => L.holdMs },
  { k: 'vib',   min: 0.0, max: 3.0, step: 0.1, label: () => L.vibStr, feedback: true },
];
// Reference pulse the vibration-strength slider previews with: vibrate()
// multiplies it by the value just set, so dragging the slider buzzes at the
// strength being chosen (0 = no buzz). Rate-limited so each tap plays fully
// rather than restarting the motor on every input event.
const VIB_PREVIEW_BASE = 30;
let lastVibPreviewMs = 0;
function buildLocalRows(body) {
  const h = document.createElement('div');
  h.className = 'cfg-sec';
  h.textContent = L.localSec;
  body.appendChild(h);
  for (const spec of LOCAL_ROWS) {
    const row = document.createElement('div');
    row.className = 'cfg-row col';
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;gap:8px;';
    const lab = document.createElement('span');
    lab.className = 'lab';
    lab.textContent = spec.label();
    const val = document.createElement('span');
    val.className = 'val';
    val.textContent = TUNE[spec.k].toFixed(decimals(spec.step));
    head.append(lab, val);
    const s = document.createElement('input');
    s.type = 'range';
    s.min = spec.min; s.max = spec.max; s.step = spec.step;
    s.value = TUNE[spec.k];
    s.addEventListener('input', () => {
      TUNE[spec.k] = +s.value;
      val.textContent = (+s.value).toFixed(decimals(spec.step));
      saveTune();
      if (spec.feedback) {
        // Preview the new strength (vibrate() scales by the value just set).
        const now = performance.now();
        if (now - lastVibPreviewMs >= 120) {
          lastVibPreviewMs = now;
          vibrate(VIB_PREVIEW_BASE);
        }
      }
    });
    row.append(head, s);
    body.appendChild(row);
  }
  const resetRow = document.createElement('div');
  resetRow.className = 'cfg-row';
  const reset = document.createElement('button');
  reset.style.width = '100%';
  reset.textContent = L.localReset;
  reset.addEventListener('click', () => {
    Object.assign(TUNE, TUNE_DEF);
    saveTune();
    cfgSig = ''; // rebuild so the sliders snap back to the defaults
    renderCfg();
    vibrate(15);
  });
  resetRow.append(reset);
  body.appendChild(resetRow);
}
function buildRow(r) {
  const row = document.createElement('div');
  row.className = 'cfg-row';
  row.dataset.k = r.k;
  rowEls.set(r.k, row);
  const lab = document.createElement('span');
  lab.className = 'lab';
  lab.textContent = r.label || '';
  if (r.type === 'status') {
    const val = document.createElement('span');
    val.className = 'val';
    row.append(lab, val);
  } else if (r.type === 'toggle') {
    const c = document.createElement('input');
    c.type = 'checkbox';
    c.checked = !!r.v; // initialize here so a rebuild keeps the pushed state
    c.addEventListener('change', () => { sendSet(r.k, c.checked); vibrate(8); });
    row.append(lab, c);
  } else if (r.type === 'slider') {
    row.classList.add('col');
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;justify-content:space-between;gap:8px;';
    const val = document.createElement('span');
    val.className = 'val';
    head.append(lab, val);
    const s = document.createElement('input');
    s.type = 'range';
    s.min = r.min; s.max = r.max; s.step = r.step;
    if (r.v != null) { s.value = r.v; val.textContent = (+r.v).toFixed(decimals(r.step)); }
    let lastSend = 0;
    s.addEventListener('input', () => {
      touched.set(r.k, performance.now());
      val.textContent = (+s.value).toFixed(decimals(r.step));
      const now = performance.now();
      if (now - lastSend > 100) { lastSend = now; send({ t: 'set', k: r.k, v: +s.value }); }
    });
    s.addEventListener('change', () => sendSet(r.k, +s.value));
    row.append(head, s);
  } else if (r.type === 'combo') {
    const sel = document.createElement('select');
    for (const o of r.options || []) {
      const op = document.createElement('option');
      op.value = o.v;
      op.textContent = o.label;
      sel.appendChild(op);
    }
    if (r.v != null) sel.value = r.v; // initialize so a rebuild keeps the choice
    sel.addEventListener('change', () => { sendSet(r.k, sel.value); vibrate(8); });
    row.append(lab, sel);
  } else if (r.type === 'action') {
    const b = document.createElement('button');
    b.style.width = '100%';
    b.textContent = r.label || '';
    b.addEventListener('click', () => { sendSet(r.k, true); vibrate(10); });
    row.append(b);
  } else { /* text | number */
    const i = document.createElement('input');
    i.type = r.type === 'number' ? 'number' : 'text';
    if (r.type === 'number') { i.min = r.min; i.max = r.max; }
    if (r.v != null) i.value = r.v; // initialize so a rebuild keeps the value
    // Hold off remote updates while the field is being edited.
    i.addEventListener('focus', () => touched.set(r.k, performance.now() + 3600000));
    i.addEventListener('blur', () => touched.set(r.k, performance.now()));
    i.addEventListener('change', () => send({ t: 'set', k: r.k, v: r.type === 'number' ? +i.value : i.value }));
    row.append(lab, i);
  }
  return row;
}
function updateCfg() {
  const body = $('cfg-body');
  const now = performance.now();
  for (const sec of cfgData.sections) {
    for (const r of sec.rows) {
      const row = rowEls.get(r.k);
      if (!row) continue;
      row.classList.toggle('off', r.enabled === false);
      if (r.type === 'status') {
        row.querySelector('.val').textContent = r.v || '';
        continue;
      }
      if (r.type === 'action') {
        const b = row.querySelector('button');
        if (b && r.label) b.textContent = r.label;
        continue;
      }
      const ts = touched.get(r.k);
      if (ts !== undefined && now - ts < 1500) continue;
      if (r.type === 'toggle') {
        row.querySelector('input').checked = !!r.v;
      } else if (r.type === 'slider') {
        const s = row.querySelector('input');
        s.value = r.v;
        row.querySelector('.val').textContent = (+r.v).toFixed(decimals(r.step));
      } else if (r.type === 'combo') {
        row.querySelector('select').value = r.v;
      } else {
        const i = row.querySelector('input');
        if (document.activeElement !== i) i.value = r.v;
      }
    }
  }
}
$('btn-cfg').addEventListener('click', () => {
  $('cfg').classList.add('on');
  cfgSig = ''; // force a rebuild with the latest snapshot
  renderCfg();
});
$('btn-cfg-close').addEventListener('click', () => $('cfg').classList.remove('on'));

/* Keyboard panel: compose with the phone's native IME, then send the confirmed
   string in one message (the host types it via KEYEVENTF_UNICODE, so Japanese
   lands as literal characters). The editing keys send named virtual keys so the
   text already on the host can be fixed without retyping. */
const kbdText = $('kbd-text');
/* Host focus hint: the server's state carries edit=true while the host has a
   typable field focused. Pulse the keyboard button (and buzz once) so a tap is
   inviting; we never auto-open the panel - the phone's keyboard needs a tap to
   appear anyway, and auto-opening would fight touchpad use. */
let editHint = false;
function applyEdit(on) {
  on = !!on;
  if (on === editHint) return;
  editHint = on;
  // No point pulsing while the panel is already open.
  const show = on && !$('kbd').classList.contains('on');
  $('btn-kbd').classList.toggle('hint', show);
  if (show) vibrate(15);
}
$('btn-kbd').addEventListener('click', () => {
  $('kbd').classList.add('on');
  $('btn-kbd').classList.remove('hint'); // opened: stop inviting
  kbdText.focus(); // pops the phone's soft keyboard; host focus is untouched
});
$('btn-kbd-close').addEventListener('click', () => {
  $('kbd').classList.remove('on');
  kbdText.blur();
});
function sendText(withEnter) {
  const t = kbdText.value;
  if (t) send({ t: 'text', s: t });
  if (withEnter) send({ t: 'key', k: 'enter' });
  kbdText.value = '';
  kbdText.focus();
  vibrate(12);
}
$('btn-send').addEventListener('click', () => sendText(false));
$('btn-send-enter').addEventListener('click', () => sendText(true));
/* Editing/navigation keys mirrored by name in remote_control.cpp's VKEYS table.
   Symbols are language-neutral, so these need no DICTS entries. */
const KBD_KEYS = [
  { k: 'backspace', t: '⌫' }, { k: 'enter', t: '⏎' }, { k: 'tab', t: '⇥' },
  { k: 'esc', t: 'Esc' }, { k: 'left', t: '←' }, { k: 'right', t: '→' },
  { k: 'up', t: '↑' }, { k: 'down', t: '↓' },
  { k: 'home', t: 'Home' }, { k: 'end', t: 'End' }, { k: 'del', t: 'Del' },
];
(function buildKbdKeys() {
  const keys = $('kbd-keys');
  for (const spec of KBD_KEYS) {
    const b = document.createElement('button');
    b.textContent = spec.t;
    b.addEventListener('click', () => { send({ t: 'key', k: spec.k }); vibrate(8); });
    keys.appendChild(b);
  }
})();

/* Fullscreen (Android Chrome; iOS Safari hides the button). */
const fsBtn = $('btn-fs');
if (document.documentElement.requestFullscreen) {
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
} else {
  fsBtn.style.display = 'none';
}

/* Keep the screen awake while the remote is open; on return to the
   foreground re-acquire it and reconnect right away (the plugin evicts
   idle sessions, so the old socket is usually gone by then). */
let wakeLock = null;
async function lock() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  lock();
  if (!ws || ws.readyState > 1) connect();
});
lock();

document.addEventListener('contextmenu', e => e.preventDefault());
/* Suppress the browser's native long-press gesture (its OS haptic at
   ~500 ms reads as a late, misplaced drag cue). Pointer events still fire;
   only the derived defaults are dropped. */
const stopNative = e => e.preventDefault();
pad.addEventListener('touchstart', stopNative, { passive: false });
strip.addEventListener('touchstart', stopNative, { passive: false });

/* Vibration self-test: tap the rev marker for one long, unmistakable buzz.
   If this stays silent, navigator.vibrate is dead in this browser/device
   (iOS Safari, Brave, or an OS touch-feedback setting). */
$('rev').addEventListener('click', () => {
  const ok = navigator.vibrate ? navigator.vibrate(200) : false;
  $('rev').textContent = (navigator.vibrate ? (ok ? 'vib✓' : 'vib✗') : 'no API') + ' r21';
});
</script>
</body>
</html>
